name: Make Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  make_release:
    runs-on: ubuntu-22.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenxr-dev
          rustup update stable

      - name: Cargo Build
        run: |
          cargo build --release --locked
          chmod +x target/release/oscavmgr

      - name: Create draft release and upload binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" target/release/oscavmgr --clobber
          else
            gh release create "$GITHUB_REF_NAME" target/release/oscavmgr \
              --draft \
              --title "OscAvMgr $GITHUB_REF_NAME" \
              --verify-tag
          fi
